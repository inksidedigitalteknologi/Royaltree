<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Withdrawals — Royaltree Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
  <script>
    (function() {
      if (!localStorage.getItem('royaltree_admin_token')) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>

  <div class="flex-grow-1" style="min-width:0;">
    <div id="admin-navbar"></div>

    <main class="admin-content">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h4 class="mb-1 fw-bold">Withdrawals</h4>
          <p class="text-muted mb-0 small">Approve / reject permintaan penarikan</p>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
      </div>

      <!-- Filter Tabs -->
      <ul class="nav nav-pills mb-4" id="statusFilter">
        <li class="nav-item">
          <button class="nav-link active" data-status="PENDING">
            <i class="bi bi-hourglass-split me-1"></i>Pending
            <span class="badge bg-danger ms-1" id="countPending">0</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-status="PAID">
            <i class="bi bi-check-circle me-1"></i>Paid
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-status="REJECTED">
            <i class="bi bi-x-circle me-1"></i>Rejected
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-status="ALL">
            <i class="bi bi-list-ul me-1"></i>Semua
          </button>
        </li>
      </ul>

      <!-- Stats -->
      <div class="row g-3 mb-4" id="withdrawalStats">
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-warning-subtle text-warning mb-2">
                <i class="bi bi-hourglass-split"></i>
              </div>
              <div class="stat-value" id="statPending">0</div>
              <div class="stat-label">Pending</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-success-subtle text-success mb-2">
                <i class="bi bi-check-circle"></i>
              </div>
              <div class="stat-value" id="statPaid">0</div>
              <div class="stat-label">Paid</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-danger-subtle text-danger mb-2">
                <i class="bi bi-x-circle"></i>
              </div>
              <div class="stat-value" id="statRejected">0</div>
              <div class="stat-label">Rejected</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-primary-subtle text-primary mb-2">
                <i class="bi bi-cash-stack"></i>
              </div>
              <div class="stat-value" id="statAmount">0</div>
              <div class="stat-label">Total Pending</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card stat-card">
        <div class="card-body p-0" id="wdTable">
          <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Modal Approve/Reject -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmTitle">Konfirmasi</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2" id="confirmMessage"></p>
        <div class="mb-2">
          <label class="form-label small fw-semibold">Catatan Admin (opsional)</label>
          <textarea class="form-control form-control-sm" id="adminNote" rows="2" placeholder="Catatan..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button class="btn btn-primary" id="confirmBtn">Konfirmasi</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(async function () {
  AdminLayout.init('Withdrawals');

  let currentStatus = 'PENDING';
  let confirmAction = null;
  const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));

  function statusBadge(s) {
    const map = {
      'PENDING':  'bg-warning text-dark',
      'PAID':     'bg-success',
      'REJECTED': 'bg-danger',
      'APPROVED': 'bg-success'
    };
    return `<span class="badge ${map[s] || 'bg-secondary'}">${s || 'UNKNOWN'}</span>`;
  }

  async function loadData() {
    const el = document.getElementById('wdTable');
    el.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

    // Ambil list (semua untuk stats, filter untuk tampilan)
    const allRes = await AdminAPI.getAllWithdrawals();
    const allData = allRes.data || [];

    // Update stats
    const pending = allData.filter(w => w.status === 'PENDING');
    const paid = allData.filter(w => w.status === 'PAID');
    const rejected = allData.filter(w => w.status === 'REJECTED');
    const totalAmount = pending.reduce((s, w) => s + (w.amount || 0), 0);

    document.getElementById('statPending').textContent = AdminAPI.fmtNumber(pending.length);
    document.getElementById('statPaid').textContent = AdminAPI.fmtNumber(paid.length);
    document.getElementById('statRejected').textContent = AdminAPI.fmtNumber(rejected.length);
    document.getElementById('statAmount').textContent = AdminAPI.fmtNumber(totalAmount);
    document.getElementById('countPending').textContent = pending.length;

    // Filter sesuai tab aktif
    let displayData = allData;
    if (currentStatus !== 'ALL') {
      displayData = allData.filter(w => w.status === currentStatus);
    }

    renderTable(displayData);
  }

  function renderTable(list) {
    const el = document.getElementById('wdTable');

    if (list.length === 0) {
      el.innerHTML = `
        <div class="text-center py-5">
          <i class="bi bi-inbox text-muted" style="font-size:3rem;"></i>
          <h5 class="mt-3 mb-1">Tidak Ada Withdrawal</h5>
          <p class="text-muted small mb-0">
            ${currentStatus === 'PENDING' ? 'Belum ada permintaan penarikan 🎉' : `Tidak ada data dengan status "${currentStatus}"`}
          </p>
        </div>`;
      return;
    }

    el.innerHTML = `
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead>
            <tr>
              <th>User</th>
              <th class="text-end">Amount</th>
              <th>Method</th>
              <th>Destination</th>
              <th>Waktu</th>
              <th class="text-center">Status</th>
              <th class="text-end">Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(w => `
              <tr>
                <td>
                  <code class="small">${AdminAPI.escapeHtml((w.userId || w.uid || w.user || '-').slice(0, 14))}</code>
                </td>
                <td class="text-end fw-semibold">${AdminAPI.fmtNumber(w.amount || 0)}</td>
                <td><span class="badge bg-light text-dark">${AdminAPI.escapeHtml(w.method || '-')}</span></td>
                <td class="small">
                  ${AdminAPI.escapeHtml((w.destination || w.accountNumber || '-').slice(0, 24))}
                  ${w.accountName ? `<br><span class="text-muted">${AdminAPI.escapeHtml(w.accountName)}</span>` : ''}
                </td>
                <td class="small text-muted">${AdminAPI.fmtDate(w.timestamp || w.createdAt)}</td>
                <td class="text-center">${statusBadge(w.status)}</td>
                <td class="text-end">
                  ${w.status === 'PENDING' ? `
                    <div class="btn-group btn-group-sm">
                      <button class="btn btn-outline-success" onclick="approveWd('${w.id}')" title="Approve">
                        <i class="bi bi-check-lg"></i>
                      </button>
                      <button class="btn btn-outline-danger" onclick="rejectWd('${w.id}')" title="Reject">
                        <i class="bi bi-x-lg"></i>
                      </button>
                    </div>
                  ` : `
                    <span class="text-muted small">
                      ${w.adminNotes ? AdminAPI.escapeHtml(w.adminNotes) : '-'}
                    </span>
                  `}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // ============ STATUS FILTER ============
  document.querySelectorAll('#statusFilter .nav-link').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#statusFilter .nav-link').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStatus = btn.dataset.status;
      loadData();
    };
  });

  // ============ APPROVE / REJECT ============
  function openConfirm(title, message, actionLabel, actionClass, onConfirm) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMessage').innerHTML = message;
    document.getElementById('adminNote').value = '';
    const btn = document.getElementById('confirmBtn');
    btn.textContent = actionLabel;
    btn.className = 'btn ' + actionClass;
    confirmAction = onConfirm;
    confirmModal.show();
  }

  document.getElementById('confirmBtn').onclick = async () => {
    if (!confirmAction) return;
    const note = document.getElementById('adminNote').value.trim();
    await confirmAction(note);
    confirmModal.hide();
    confirmAction = null;
  };

  window.approveWd = (id) => {
    openConfirm(
      'Approve Withdrawal',
      `<i class="bi bi-check-circle text-success me-2"></i>Setujui permintaan withdrawal ini?`,
      'Approve',
      'btn-success',
      async (note) => {
        const res = await AdminAPI.approveWithdrawal(id, note);
        if (res.success) {
          AdminAPI.toast('Withdrawal disetujui', 'success');
          loadData();
        } else {
          AdminAPI.toast(res.message || 'Gagal approve', 'error');
        }
      }
    );
  };

  window.rejectWd = (id) => {
    openConfirm(
      'Reject Withdrawal',
      `<i class="bi bi-x-circle text-danger me-2"></i>Tolak permintaan withdrawal ini?`,
      'Reject',
      'btn-danger',
      async (note) => {
        const res = await AdminAPI.rejectWithdrawal(id, note);
        if (res.success) {
          AdminAPI.toast('Withdrawal ditolak', 'success');
          loadData();
        } else {
          AdminAPI.toast(res.message || 'Gagal reject', 'error');
        }
      }
    );
  };

  document.getElementById('refreshBtn').onclick = () => {
    loadData();
    AdminAPI.toast('Data diperbarui', 'success');
  };

  await loadData();
})();
</script>
</body>
</html>
