<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Royaltree Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
</head>
<body>

<div class="login-wrapper">
  <div class="card login-card">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle mb-3" style="width:64px;height:64px;">
          <i class="bi bi-tree-fill fs-2"></i>
        </div>
        <h4 class="fw-bold mb-1">Royaltree Admin</h4>
        <p class="text-muted small mb-0">Masuk untuk mengakses panel admin</p>
      </div>

      <div id="alertBox"></div>

      <form id="loginForm" autocomplete="off">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Admin Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
            <input type="password" class="form-control" id="password"
                   placeholder="Masukkan password" required autofocus>
            <button class="btn btn-outline-secondary" type="button" id="togglePw" tabindex="-1">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">API Key</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
            <input type="password" class="form-control" id="apiKey"
                   placeholder="Royaltree API Key" required>
          </div>
          <div class="form-text small">Diperlukan untuk otentikasi API</div>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold" id="loginBtn">
          <i class="bi bi-box-arrow-in-right me-1"></i> Login
        </button>
      </form>

      <hr class="my-4">
      <p class="text-center text-muted small mb-0">
        <i class="bi bi-shield-lock me-1"></i>Royaltree &copy; <span id="year"></span>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script>
(function () {
  document.getElementById('year').textContent = new Date().getFullYear();

  const form = document.getElementById('loginForm');
  const pwInput = document.getElementById('password');
  const apiKeyInput = document.getElementById('apiKey');
  const btn = document.getElementById('loginBtn');
  const alertBox = document.getElementById('alertBox');

  const API_KEY_STORAGE = 'royaltree_admin_apikey';

  if (AdminAPI.Auth.isLoggedIn()) {
    window.location.href = 'index.html';
    return;
  }

  const savedApiKey = localStorage.getItem(API_KEY_STORAGE);
  if (savedApiKey) apiKeyInput.value = savedApiKey;

  if (new URLSearchParams(location.search).get('expired') === '1') {
    showAlert('Session expired. Silakan login ulang.', 'warning');
  }

  document.getElementById('togglePw').addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    document.getElementById('toggleIcon').className = `bi bi-eye${isPw ? '-slash' : ''}`;
  });

  function showAlert(msg, type = 'danger') {
    alertBox.innerHTML = `
      <div class="alert alert-${type} py-2 small d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>${AdminAPI.escapeHtml(msg)}
      </div>`;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = pwInput.value.trim();
    const apiKey = apiKeyInput.value.trim();
    if (!password || !apiKey) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memverifikasi...';
    alertBox.innerHTML = '';

    const result = await AdminAPI.login(password, apiKey);

    if (result.success && result.token) {
      AdminAPI.Auth.setToken(result.token);
      AdminAPI.Auth.setName('Admin');
      localStorage.setItem(API_KEY_STORAGE, apiKey);
      btn.innerHTML = '<i class="bi bi-check-circle me-1"></i>Berhasil!';
      setTimeout(() => window.location.href = 'index.html', 400);
    } else {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Login';
      showAlert(result.message || 'Password atau API Key salah.');
      pwInput.select();
    }
  });
})();
</script>
</body>
</html>
