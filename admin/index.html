<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Royaltree Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
  <script>
    (function() {
      if (!localStorage.getItem('royaltree_admin_token')) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>

  <div class="flex-grow-1" style="min-width:0;">
    <div id="admin-navbar"></div>

    <main class="admin-content">
      <!-- Welcome -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4 class="mb-1 fw-bold">Dashboard</h4>
          <p class="text-muted mb-0 small">Overview sistem Royaltree</p>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
      </div>

      <!-- Stat Cards -->
      <div class="row g-3 mb-4" id="statCards">
        <div class="col-12 text-center py-4">
          <div class="spinner-border text-success" role="status"></div>
          <p class="text-muted small mt-2 mb-0">Memuat statistik...</p>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="row g-3 mb-4">
        <div class="col-12">
          <div class="card stat-card">
            <div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-lightning-charge me-2 text-warning"></i>Quick Actions</h6>
              <div class="d-flex flex-wrap gap-2">
                <a href="users.html" class="btn btn-sm btn-outline-primary">
                  <i class="bi bi-people me-1"></i>Manage Users
                </a>
                <a href="withdrawals.html" class="btn btn-sm btn-outline-success">
                  <i class="bi bi-cash-stack me-1"></i>Withdrawals
                </a>
                <a href="anomalies.html" class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-shield-exclamation me-1"></i>Anomalies
                  <span class="badge bg-danger ms-1" id="anomalyBadge" style="display:none;">0</span>
                </a>
                <a href="chat.html" class="btn btn-sm btn-outline-info">
                  <i class="bi bi-chat-dots me-1"></i>Chat
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Recent Anomalies -->
      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card stat-card h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0"><i class="bi bi-shield-exclamation me-2 text-danger"></i>Anomali Terbaru</h6>
                <a href="anomalies.html" class="btn btn-sm btn-link text-decoration-none">Lihat semua →</a>
              </div>
              <div id="recentAnomalies">
                <p class="text-muted small mb-0">Memuat...</p>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card stat-card h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0"><i class="bi bi-cash-stack me-2 text-success"></i>Withdrawal Pending</h6>
                <a href="withdrawals.html" class="btn btn-sm btn-link text-decoration-none">Lihat semua →</a>
              </div>
              <div id="recentWithdrawals">
                <p class="text-muted small mb-0">Memuat...</p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(async function () {
  AdminLayout.init('Dashboard');

  const statCards = document.getElementById('statCards');
  const recentAnomalies = document.getElementById('recentAnomalies');
  const recentWithdrawals = document.getElementById('recentWithdrawals');

  function renderStatCards(stats) {
    const cards = [
      { label: 'Total Users',      value: stats.totalUsers || 0,      icon: 'people',        color: 'primary', suffix: '' },
      { label: 'Total RTP',        value: stats.totalRtp || 0,        icon: 'coin',          color: 'warning', suffix: '' },
      { label: 'Pending Withdrawal', value: stats.pendingWithdrawals || 0, icon: 'cash-stack', color: 'success', suffix: '' },
      { label: 'Transaksi',        value: stats.totalTransactions || 0, icon: 'receipt',    color: 'danger', suffix: '' },
      { label: 'Miners',           value: stats.totalMiners || 0,     icon: 'cpu',           color: 'dark',    suffix: '' },
      { label: 'Mining Blocks',    value: stats.totalBlocks || 0,     icon: 'box',           color: 'info',    suffix: '' },
      { label: 'Chat Messages',    value: stats.totalChatMessages || 0, icon: 'chat-dots',   color: 'secondary', suffix: '' }
    ];

    statCards.innerHTML = cards.map(c => `
      <div class="col-6 col-md-4 col-lg-2">
        <div class="card stat-card">
          <div class="card-body">
            <div class="d-flex align-items-center mb-2">
              <div class="stat-icon bg-${c.color}-subtle text-${c.color}">
                <i class="bi bi-${c.icon}"></i>
              </div>
            </div>
            <div class="stat-value">${AdminAPI.fmtNumber(c.value)}${c.suffix}</div>
            <div class="stat-label">${c.label}</div>
          </div>
        </div>
      </div>`).join('');
  }

  async function loadStats() {
    statCards.innerHTML = '<div class="col-12 text-center py-4"><div class="spinner-border text-success"></div></div>';

    const result = await AdminAPI.getStats();

    if (result.success) {
      // Support both flat structure { totalUsers } and nested { data: { totalUsers } }
      const stats = result.data || result;
      renderStatCards(stats);

      // Update anomaly badge (async — pakai endpoint terpisah)
      AdminAPI.getAnomalyStats().then(res => {
        const data = res?.data || res || {};
        const total = data.openAnomalies || data.totalAnomalies || 0;
        if (total > 0) {
          const badge = document.getElementById('anomalyBadge');
          badge.textContent = total;
          badge.style.display = '';
        }
      }).catch(() => {});
    } else {
      statCards.innerHTML = `
        <div class="col-12">
          <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle me-2"></i>
            Gagal memuat statistik: ${AdminAPI.escapeHtml(result.message || 'Unknown error')}
          </div>
        </div>`;
    }
  }

  async function loadRecentAnomalies() {
    const result = await AdminAPI.getAnomalies({ limit: 5 });
    if (!result.success) {
      recentAnomalies.innerHTML = `<p class="text-muted small mb-0">Gagal memuat</p>`;
      return;
    }

    const list = result.anomalies || [];
    if (list.length === 0) {
      recentAnomalies.innerHTML = `
        <div class="text-center py-3">
          <i class="bi bi-check-circle text-success fs-1"></i>
          <p class="text-muted small mt-2 mb-0">Tidak ada anomali 🎉</p>
        </div>`;
      return;
    }

    recentAnomalies.innerHTML = `
      <div class="list-group list-group-flush">
        ${list.map(a => `
          <div class="list-group-item px-0 py-2 border-0 border-bottom">
            <div class="d-flex justify-content-between align-items-start">
              <div class="flex-grow-1">
                <span class="badge badge-severity-${a.severity || 'LOW'} me-2">${a.severity || 'LOW'}</span>
                <strong class="small">${AdminAPI.escapeHtml(a.type || a.reason || 'Anomali')}</strong>
                <div class="text-muted small">UID: ${AdminAPI.escapeHtml((a.uid || '').slice(0, 12))}...</div>
              </div>
              <span class="badge badge-status-${a.status || 'OPEN'}">${a.status || 'OPEN'}</span>
            </div>
          </div>
        `).join('')}
      </div>`;
  }

  async function loadRecentWithdrawals() {
    const result = await AdminAPI.getWithdrawals('PENDING');
    if (!result.success) {
      recentWithdrawals.innerHTML = `<p class="text-muted small mb-0">Gagal memuat</p>`;
      return;
    }

    const list = (result.data || result.withdrawals || []).slice(0, 5);
    if (list.length === 0) {
      recentWithdrawals.innerHTML = `
        <div class="text-center py-3">
          <i class="bi bi-check-circle text-success fs-1"></i>
          <p class="text-muted small mt-2 mb-0">Tidak ada withdrawal pending</p>
        </div>`;
      return;
    }

    recentWithdrawals.innerHTML = `
      <div class="list-group list-group-flush">
        ${list.map(w => `
          <div class="list-group-item px-0 py-2 border-0 border-bottom">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <strong class="small">${AdminAPI.escapeHtml(w.destination || w.method || 'Withdrawal')}</strong>
                <div class="text-muted small">${AdminAPI.fmtDate(w.createdAt)}</div>
              </div>
              <div class="text-end">
                <div class="fw-bold">${AdminAPI.fmtNumber(w.amount || 0)}</div>
                <a href="withdrawals.html" class="btn btn-sm btn-link p-0 text-decoration-none small">Proses →</a>
              </div>
            </div>
          </div>
        `).join('')}
      </div>`;
  }

  async function loadAll() {
    await Promise.all([
      loadStats(),
      loadRecentAnomalies(),
      loadRecentWithdrawals()
    ]);
  }

  // Initial load
  await loadAll();

  // Refresh button
  document.getElementById('refreshBtn').addEventListener('click', async () => {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Memuat...';
    await loadAll();
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-arrow-clockwise me-1"></i> Refresh';
    AdminAPI.toast('Data diperbarui', 'success');
  });
})();
</script>
</body>
</html>
