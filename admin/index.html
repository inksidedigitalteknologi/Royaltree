<!doctype html>
<html lang="id"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Royaltree Admin</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#0f1115;color:#e7e9ee}
header{padding:14px 20px;background:#171a21;border-bottom:1px solid #262a33;display:flex;gap:12px;align-items:center}
h1{font-size:16px;margin:0}nav button{background:#222733;color:#cdd3df;border:1px solid #2f3543;padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.active{background:#3a63ff;border-color:#3a63ff;color:#fff}main{padding:20px;max-width:760px}
section{display:none}section.active{display:block}label{display:block;margin:10px 0 4px;font-size:13px;color:#aab2c0}
input{width:100%;padding:8px;border-radius:6px;border:1px solid #2f3543;background:#171a21;color:#e7e9ee;box-sizing:border-box}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button.primary{margin-top:16px;background:#3a63ff;border:none;color:#fff;padding:10px 16px;border-radius:6px;cursor:pointer}
#toast{position:fixed;bottom:20px;right:20px;background:#1f6f3a;color:#fff;padding:10px 16px;border-radius:6px;display:none}
#toast.err{background:#8a2b2b}
</style></head><body>
<header><h1>Royaltree Admin</h1><nav>
<button data-tab="weights" class="active">Mining Weights</button>
<button data-tab="fusion">Fusion Config</button></nav></header>
<main>
<section id="weights" class="active"><h2>Mining Weights</h2><div class="row">
<div><label>Weight Hashrate</label><input id="w_hash" type="number" step="0.01"></div>
<div><label>Weight Efficiency</label><input id="w_eff" type="number" step="0.01"></div>
<div><label>Weight Ping</label><input id="w_ping" type="number" step="0.01"></div>
<div><label>Weight Device</label><input id="w_dev" type="number" step="0.01"></div>
<div><label>Weight Thermal</label><input id="w_therm" type="number" step="0.01"></div>
<div><label>Floor</label><input id="w_floor" type="number" step="0.01"></div></div>
<button class="primary" onclick="saveWeights()">Simpan</button></section>
<section id="fusion"><h2>Fusion Config (biaya RTP)</h2><div class="row">
<div><label>COMMON</label><input id="f_common" type="number" step="1"></div>
<div><label>RARE</label><input id="f_rare" type="number" step="1"></div>
<div><label>EPIC</label><input id="f_epic" type="number" step="1"></div>
<div><label>LEGENDARY</label><input id="f_legendary" type="number" step="1"></div></div>
<button class="primary" onclick="saveFusion()">Simpan</button></section>
</main><div id="toast"></div>
<script>
const API='';const TOKEN=localStorage.getItem('admin_token')||'';
const h={'Content-Type':'application/json','Authorization':'Bearer '+TOKEN};
function toast(m,e=false){const t=document.getElementById('toast');t.textContent=m;t.className=e?'err':'';t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');});
async function loadWeights(){const r=await fetch(API+'/admin/mining-weights',{headers:h});const d=await r.json();w_hash.value=d.hashrate;w_eff.value=d.efficiency;w_ping.value=d.ping;w_dev.value=d.device;w_therm.value=d.thermal;w_floor.value=d.floor;}
async function saveWeights(){const b={hashrate:+w_hash.value,efficiency:+w_eff.value,ping:+w_ping.value,device:+w_dev.value,thermal:+w_therm.value,floor:+w_floor.value};const r=await fetch(API+'/admin/mining-weights',{method:'PUT',headers:h,body:JSON.stringify(b)});r.ok?toast('Tersimpan'):toast('Gagal',true);}
async function loadFusion(){const r=await fetch(API+'/admin/fusion-config',{headers:h});const d=await r.json();f_common.value=d.COMMON;f_rare.value=d.RARE;f_epic.value=d.EPIC;f_legendary.value=d.LEGENDARY;}
async function saveFusion(){const b={COMMON:+f_common.value,RARE:+f_rare.value,EPIC:+f_epic.value,LEGENDARY:+f_legendary.value};const r=await fetch(API+'/admin/fusion-config',{method:'PUT',headers:h,body:JSON.stringify(b)});r.ok?toast('Tersimpan'):toast('Gagal',true);}
loadWeights();loadFusion();
</script></body></html>
