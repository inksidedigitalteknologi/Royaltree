<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anomalies — Royaltree Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
  <script>
    (function() {
      if (!localStorage.getItem('royaltree_admin_token')) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>

  <div class="flex-grow-1" style="min-width:0;">
    <div id="admin-navbar"></div>

    <main class="admin-content">
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h4 class="mb-1 fw-bold">Anomalies</h4>
          <p class="text-muted mb-0 small">Deteksi aktivitas mencurigakan & fraud</p>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
      </div>

      <!-- Stat Cards -->
      <div class="row g-3 mb-4" id="anomalyStats">
        <div class="col-12 text-center py-4">
          <div class="spinner-border text-danger"></div>
        </div>
      </div>

      <!-- Filter -->
      <div class="card stat-card mb-4">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small fw-semibold mb-1">Severity</label>
              <select class="form-select form-select-sm" id="filterSeverity">
                <option value="">Semua Severity</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
                <option value="CRITICAL">Critical</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold mb-1">Status</label>
              <select class="form-select form-select-sm" id="filterStatus">
                <option value="">Semua Status</option>
                <option value="OPEN">Open</option>
                <option value="REVIEWED">Reviewed</option>
                <option value="BANNED">Banned</option>
                <option value="DISMISSED">Dismissed</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold mb-1">UID</label>
              <input type="text" class="form-control form-control-sm" id="filterUid" placeholder="Cari UID...">
            </div>
            <div class="col-md-3 d-flex gap-2">
              <button class="btn btn-sm btn-primary flex-grow-1" id="applyFilter">
                <i class="bi bi-search me-1"></i>Filter
              </button>
              <button class="btn btn-sm btn-outline-secondary" id="resetFilter">
                <i class="bi bi-x"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <ul class="nav nav-tabs mb-3" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="tab-list-btn" data-bs-toggle="tab" data-bs-target="#tab-list" type="button">
            <i class="bi bi-list-ul me-1"></i>Daftar Anomali
            <span class="badge bg-danger ms-1" id="countList">0</span>
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-flagged-btn" data-bs-toggle="tab" data-bs-target="#tab-flagged" type="button">
            <i class="bi bi-people me-1"></i>Flagged Users
            <span class="badge bg-warning text-dark ms-1" id="countFlagged">0</span>
          </button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-list">
          <div class="card stat-card">
            <div class="card-body p-0" id="anomalyList">
              <div class="text-center py-5">
                <div class="spinner-border text-danger"></div>
                <p class="text-muted small mt-2 mb-0">Memuat anomali...</p>
              </div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-flagged">
          <div class="card stat-card">
            <div class="card-body p-0" id="flaggedList">
              <div class="text-center py-5">
                <div class="spinner-border text-warning"></div>
                <p class="text-muted small mt-2 mb-0">Memuat flagged users...</p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(async function () {
  AdminLayout.init('Anomalies');

  const statsEl = document.getElementById('anomalyStats');
  const listEl = document.getElementById('anomalyList');
  const flaggedEl = document.getElementById('flaggedList');

  // ============ STATS ============
  async function loadStats() {
    const res = await AdminAPI.getAnomalyStats();
    if (!res.success) {
      statsEl.innerHTML = `<div class="col-12"><div class="alert alert-danger">${AdminAPI.escapeHtml(res.message || 'Error')}</div></div>`;
      return;
    }

    const d = res.data || {};
    const cards = [
      { label: 'Total Anomali',      value: d.totalAnomalies || 0,    icon: 'shield-exclamation', color: 'danger' },
      { label: 'Open',               value: d.openAnomalies || 0,     icon: 'exclamation-circle', color: 'warning' },
      { label: 'High Severity',      value: d.highSeverity || 0,      icon: 'fire',               color: 'danger' },
      { label: 'Flagged Users',      value: d.flaggedUsers || 0,      icon: 'people',             color: 'info' },
      { label: 'Auto-Ban Candidate', value: d.autoBanCandidates || 0, icon: 'hammer',             color: 'dark' }
    ];

    statsEl.innerHTML = cards.map(c => `
      <div class="col-6 col-md-4 col-lg-2 flex-grow-1">
        <div class="card stat-card">
          <div class="card-body">
            <div class="stat-icon bg-${c.color}-subtle text-${c.color} mb-2">
              <i class="bi bi-${c.icon}"></i>
            </div>
            <div class="stat-value">${AdminAPI.fmtNumber(c.value)}</div>
            <div class="stat-label">${c.label}</div>
          </div>
        </div>
      </div>`).join('');
  }

  // ============ LIST ANOMALIES ============
  async function loadAnomalies() {
    listEl.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-danger"></div></div>';

    const params = {};
    const sev = document.getElementById('filterSeverity').value;
    const sts = document.getElementById('filterStatus').value;
    const uid = document.getElementById('filterUid').value.trim();
    if (sev) params.severity = sev;
    if (sts) params.status = sts;
    if (uid) params.uid = uid;

    const res = await AdminAPI.getAnomalies(params);
    document.getElementById('countList').textContent = res.count || 0;

    if (!res.success) {
      listEl.innerHTML = `<div class="alert alert-danger m-3">${AdminAPI.escapeHtml(res.message || 'Error')}</div>`;
      return;
    }

    const list = res.anomalies || [];
    if (list.length === 0) {
      listEl.innerHTML = `
        <div class="text-center py-5">
          <i class="bi bi-shield-check text-success" style="font-size:3rem;"></i>
          <h5 class="mt-3 mb-1">Tidak Ada Anomali</h5>
          <p class="text-muted small mb-0">Semua user aman 🎉</p>
        </div>`;
      return;
    }

    listEl.innerHTML = `
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Severity</th>
              <th>Type</th>
              <th>UID</th>
              <th>Detail</th>
              <th>Waktu</th>
              <th>Status</th>
              <th class="text-end">Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(a => `
              <tr>
                <td><span class="badge badge-severity-${a.severity || 'LOW'}">${a.severity || 'LOW'}</span></td>
                <td><strong>${AdminAPI.escapeHtml(a.type || '-')}</strong></td>
                <td><code class="small">${AdminAPI.escapeHtml((a.uid || '').slice(0, 14))}</code></td>
                <td class="small text-muted">${AdminAPI.escapeHtml(a.message || a.reason || '-')}</td>
                <td class="small text-muted">${AdminAPI.fmtDate(a.timestamp || a.createdAt)}</td>
                <td><span class="badge badge-status-${a.status || 'OPEN'}">${a.status || 'OPEN'}</span></td>
                <td class="text-end">
                  <div class="btn-group btn-group-sm">
                    ${a.status === 'OPEN' ? `
                      <button class="btn btn-outline-warning" onclick="updateStatus('${a.id}', 'REVIEWED')" title="Mark Reviewed">
                        <i class="bi bi-eye"></i>
                      </button>
                      <button class="btn btn-outline-secondary" onclick="updateStatus('${a.id}', 'DISMISSED')" title="Dismiss">
                        <i class="bi bi-x-circle"></i>
                      </button>
                    ` : ''}
                    <button class="btn btn-outline-dark" onclick="banUser('${a.uid}')" title="Ban User">
                      <i class="bi bi-hammer"></i>
                    </button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // ============ LIST FLAGGED USERS ============
  async function loadFlagged() {
    const res = await AdminAPI.getFlaggedUsers();
    document.getElementById('countFlagged').textContent = res.count || 0;

    if (!res.success) {
      flaggedEl.innerHTML = `<div class="alert alert-danger m-3">${AdminAPI.escapeHtml(res.message || 'Error')}</div>`;
      return;
    }

    const list = res.users || [];
    if (list.length === 0) {
      flaggedEl.innerHTML = `
        <div class="text-center py-5">
          <i class="bi bi-people text-success" style="font-size:3rem;"></i>
          <h5 class="mt-3 mb-1">Tidak Ada Flagged Users</h5>
          <p class="text-muted small mb-0">Semua user bersih ✅</p>
        </div>`;
      return;
    }

    flaggedEl.innerHTML = `
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>UID</th>
              <th>Score</th>
              <th>Flags</th>
              <th>Terakhir Update</th>
              <th class="text-end">Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(u => `
              <tr>
                <td><code class="small">${AdminAPI.escapeHtml((u.uid || '').slice(0, 18))}</code></td>
                <td><span class="badge bg-${(u.score || 0) >= 100 ? 'danger' : (u.score || 0) >= 50 ? 'warning' : 'secondary'}">${u.score || 0}</span></td>
                <td class="small">${(u.flags || []).join(', ') || '-'}</td>
                <td class="small text-muted">${AdminAPI.fmtDate(u.lastUpdate)}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-secondary" onclick="clearFlag('${u.uid}')" title="Clear Flag">
                    <i class="bi bi-eraser"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger" onclick="banUser('${u.uid}')" title="Ban">
                    <i class="bi bi-hammer"></i>
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // ============ ACTIONS ============
  window.updateStatus = async (id, status) => {
    if (!confirm(`Ubah status anomali menjadi ${status}?`)) return;
    const res = await AdminAPI.updateAnomalyStatus(id, status);
    if (res.success) {
      AdminAPI.toast(`Status diubah ke ${status}`, 'success');
      loadAnomalies();
      loadStats();
    } else {
      AdminAPI.toast(res.message || 'Gagal', 'error');
    }
  };

  window.banUser = async (uid) => {
    const reason = prompt('Alasan ban (opsional):', 'Fraud detected');
    if (reason === null) return;
    const res = await AdminAPI.banUser(uid, reason);
    if (res.success) {
      AdminAPI.toast('User dibanned', 'success');
      loadAnomalies();
      loadFlagged();
    } else {
      AdminAPI.toast(res.message || 'Gagal ban', 'error');
    }
  };

  window.clearFlag = async (uid) => {
    if (!confirm('Hapus flag dari user ini?')) return;
    const res = await AdminAPI.clearFlag(uid);
    if (res.success) {
      AdminAPI.toast('Flag dihapus', 'success');
      loadFlagged();
    } else {
      AdminAPI.toast(res.message || 'Gagal', 'error');
    }
  };

  // ============ FILTER ============
  document.getElementById('applyFilter').onclick = loadAnomalies;
  document.getElementById('resetFilter').onclick = () => {
    document.getElementById('filterSeverity').value = '';
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterUid').value = '';
    loadAnomalies();
  };
  document.getElementById('refreshBtn').onclick = () => {
    loadStats();
    loadAnomalies();
    loadFlagged();
    AdminAPI.toast('Data diperbarui', 'success');
  };

  // Initial
  await Promise.all([loadStats(), loadAnomalies(), loadFlagged()]);
})();
</script>
</body>
</html>
