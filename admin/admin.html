<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Royaltree Admin — Redirecting</title>
  <meta http-equiv="refresh" content="0; url=login.html">
  <script>
    // Redirect otomatis ke login.html (versi baru)
    if (localStorage.getItem('royaltree_admin_token')) {
      window.location.href = 'index.html';
    } else {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: white;
    }
    .box { text-align: center; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Mengalihkan ke panel admin baru...</p>
    <p style="font-size:0.85rem; opacity:0.8;">
      Kalau tidak dialihkan otomatis, <a href="login.html" style="color:white;">klik di sini</a>.
    </p>
  </div>
</body>
</html>
