<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scheduled Notif — Royaltree Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
  <script>
    (function() {
      if (!localStorage.getItem('royaltree_admin_token')) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>
  <div class="flex-grow-1" style="min-width:0;">
    <div id="admin-navbar"></div>

    <main class="admin-content">
      <div class="mb-4">
        <h4 class="mb-1 fw-bold">Scheduled Notifications</h4>
        <p class="text-muted mb-0 small">Jadwalkan broadcast untuk dikirim otomatis</p>
      </div>

      <div class="row g-4">
        <!-- Form -->
        <div class="col-lg-5">
          <div class="card stat-card">
            <div class="card-body">
              <h6 class="fw-bold mb-3">
                <i class="bi bi-clock-history text-primary me-2"></i>Buat Schedule
              </h6>

              <form id="scheduleForm">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Target</label>
                  <div class="btn-group w-100" role="group">
                    <input type="radio" class="btn-check" name="targetMode" id="schedModeAll" value="all" checked>
                    <label class="btn btn-outline-primary btn-sm" for="schedModeAll">
                      <i class="bi bi-people-fill me-1"></i>Semua
                    </label>
                    <input type="radio" class="btn-check" name="targetMode" id="schedModeUser" value="user">
                    <label class="btn btn-outline-primary btn-sm" for="schedModeUser">
                      <i class="bi bi-person-fill me-1"></i>1 User
                    </label>
                  </div>
                </div>

                <div class="mb-3 d-none" id="schedUidWrapper">
                  <label class="form-label small fw-semibold">Target UID</label>
                  <input type="text" class="form-control form-control-sm" id="schedTargetUid" placeholder="UID...">
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-semibold">Tipe</label>
                  <select class="form-select form-select-sm" id="schedType">
                    <option value="BROADCAST">📢 Broadcast</option>
                    <option value="PROMO">🎁 Promo</option>
                    <option value="MAINTENANCE">🔧 Maintenance</option>
                    <option value="REWARD">💰 Reward</option>
                    <option value="UPDATE">🚀 Update</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-semibold">Judul <span class="text-danger">*</span></label>
                  <input type="text" class="form-control form-control-sm" id="schedTitle" maxlength="80" required>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-semibold">Pesan <span class="text-danger">*</span></label>
                  <textarea class="form-control form-control-sm" id="schedMessage" rows="3" maxlength="300" required></textarea>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-semibold">Jadwal Kirim <span class="text-danger">*</span></label>
                  <input type="datetime-local" class="form-control form-control-sm" id="schedTime" required>
                  <div class="form-text small">Min. 1 menit dari sekarang</div>
                </div>

                <div id="schedAlert"></div>

                <button type="submit" class="btn btn-primary w-100" id="scheduleBtn">
                  <i class="bi bi-clock me-1"></i>Jadwalkan
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- List -->
        <div class="col-lg-7">
          <div class="card stat-card">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h6 class="fw-bold mb-0">
                <i class="bi bi-list-check me-2"></i>Daftar Scheduled
                <span class="badge bg-secondary ms-2" id="schedCount">0</span>
              </h6>
              <button class="btn btn-sm btn-outline-secondary" id="refreshSched">
                <i class="bi bi-arrow-clockwise"></i>
              </button>
            </div>
            <div class="card-body p-0" id="schedList">
              <div class="text-center py-5">
                <div class="spinner-border text-primary"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(function () {
  AdminLayout.init('Scheduled Notifications');

  const form = document.getElementById('scheduleForm');
  const btn = document.getElementById('scheduleBtn');
  const alertBox = document.getElementById('schedAlert');
  const schedTime = document.getElementById('schedTime');
  const uidWrapper = document.getElementById('schedUidWrapper');

  // Set min datetime = now + 1 min
  const minDate = new Date(Date.now() + 60000);
  const localISO = new Date(minDate.getTime() - minDate.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  schedTime.min = localISO;

  // Toggle UID
  document.querySelectorAll('input[name="targetMode"]').forEach(r => {
    r.addEventListener('change', () => {
      uidWrapper.classList.toggle('d-none', r.value !== 'user');
    });
  });

  function statusBadge(s) {
    const map = {
      'PENDING': 'bg-warning text-dark',
      'SENT': 'bg-success',
      'FAILED': 'bg-danger',
      'CANCELLED': 'bg-secondary'
    };
    return `<span class="badge ${map[s] || 'bg-secondary'}">${s || 'UNKNOWN'}</span>`;
  }

  function formatScheduledTime(ts) {
    if (!ts) return '-';
    const d = new Date(ts);
    return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  async function loadScheduled() {
    const list = document.getElementById('schedList');
    list.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

    const res = await AdminAPI.getScheduledNotifications();
    if (!res.success) {
      list.innerHTML = `<div class="alert alert-danger m-3">${AdminAPI.escapeHtml(res.message || 'Error')}</div>`;
      return;
    }

    const items = res.data || [];
    document.getElementById('schedCount').textContent = items.length;

    if (items.length === 0) {
      list.innerHTML = `
        <div class="text-center py-5">
          <i class="bi bi-clock text-muted" style="font-size:3rem;"></i>
          <h5 class="mt-3 mb-1">Belum Ada Schedule</h5>
          <p class="text-muted small mb-0">Jadwalkan notifikasi dari form</p>
        </div>`;
      return;
    }

    list.innerHTML = `
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead>
            <tr>
              <th>Judul</th>
              <th>Target</th>
              <th>Jadwal</th>
              <th>Status</th>
              <th class="text-end">Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(it => `
              <tr>
                <td>
                  <strong class="small">${AdminAPI.escapeHtml(it.title || '-')}</strong>
                  <div class="small text-muted">${AdminAPI.escapeHtml((it.message || '').slice(0, 50))}${(it.message || '').length > 50 ? '...' : ''}</div>
                </td>
                <td class="small">
                  ${it.targetUid
                    ? `<code>${AdminAPI.escapeHtml(it.targetUid.slice(0, 12))}...</code>`
                    : '<span class="badge bg-info">Semua</span>'}
                </td>
                <td class="small">${formatScheduledTime(it.scheduledAt)}</td>
                <td>${statusBadge(it.status)}</td>
                <td class="text-end">
                  ${it.status === 'PENDING' ? `
                    <button class="btn btn-sm btn-outline-danger" onclick="cancelSched('${it.id}')" title="Cancel">
                      <i class="bi bi-x-circle"></i>
                    </button>` : '-'}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  window.cancelSched = async (id) => {
    if (!confirm('Batalkan notifikasi terjadwal ini?')) return;
    const res = await AdminAPI.cancelScheduledNotification(id);
    if (res.success) {
      AdminAPI.toast('Dibatalkan', 'success');
      loadScheduled();
    } else {
      AdminAPI.toast(res.message || 'Gagal', 'error');
    }
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const targetMode = document.querySelector('input[name="targetMode"]:checked')?.value;
    const title = document.getElementById('schedTitle').value.trim();
    const message = document.getElementById('schedMessage').value.trim();
    const type = document.getElementById('schedType').value;
    const targetUid = targetMode === 'user' ? document.getElementById('schedTargetUid').value.trim() : '';
    const scheduledAtStr = schedTime.value;

    if (!title || !message || !scheduledAtStr) {
      alertBox.innerHTML = '<div class="alert alert-danger py-2 small">Semua field wajib diisi</div>';
      return;
    }
    if (targetMode === 'user' && !targetUid) {
      alertBox.innerHTML = '<div class="alert alert-danger py-2 small">UID wajib untuk target user</div>';
      return;
    }

    const scheduledAt = new Date(scheduledAtStr).getTime();
    if (scheduledAt <= Date.now()) {
      alertBox.innerHTML = '<div class="alert alert-danger py-2 small">Waktu harus di masa depan</div>';
      return;
    }

    if (!confirm(`Jadwalkan "${title}" pada ${formatScheduledTime(scheduledAt)}?`)) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Menyimpan...';
    alertBox.innerHTML = '';

    const res = await AdminAPI.scheduleNotification({
      title, message, type, targetUid, scheduledAt
    });

    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-clock me-1"></i>Jadwalkan';

    if (res.success) {
      alertBox.innerHTML = '<div class="alert alert-success py-2 small">✅ Notifikasi terjadwal dibuat</div>';
      form.reset();
      uidWrapper.classList.add('d-none');
      loadScheduled();
    } else {
      alertBox.innerHTML = `<div class="alert alert-danger py-2 small">${AdminAPI.escapeHtml(res.message || 'Gagal')}</div>`;
    }
  });

  document.getElementById('refreshSched').onclick = loadScheduled;

  loadScheduled();
})();
</script>
</body>
</html>
