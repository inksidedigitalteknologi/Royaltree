<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaigns — Royaltree Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
  <script>
    (function() {
      if (!localStorage.getItem('royaltree_admin_token')) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>
  <div class="flex-grow-1" style="min-width:0;">
    <div id="admin-navbar"></div>

    <main class="admin-content">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h4 class="mb-1 fw-bold">Campaigns</h4>
          <p class="text-muted mb-0 small">Daftar campaign affiliate & partner</p>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-primary-subtle text-primary mb-2">
                <i class="bi bi-megaphone"></i>
              </div>
              <div class="stat-value" id="statTotal">0</div>
              <div class="stat-label">Total Campaign</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-success-subtle text-success mb-2">
                <i class="bi bi-check-circle"></i>
              </div>
              <div class="stat-value" id="statActive">0</div>
              <div class="stat-label">Aktif</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-warning-subtle text-warning mb-2">
                <i class="bi bi-shop"></i>
              </div>
              <div class="stat-value" id="statMerchants">0</div>
              <div class="stat-label">Merchant</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-info-subtle text-info mb-2">
                <i class="bi bi-percent"></i>
              </div>
              <div class="stat-value" id="statAvgCommission">0%</div>
              <div class="stat-label">Avg Commission</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card stat-card">
        <div class="card-body p-0" id="campaignsTable">
          <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(async function () {
  AdminLayout.init('Campaigns');

  function statusBadge(status) {
    const map = {
      'ACTIVE': 'bg-success',
      'PAUSED': 'bg-warning text-dark',
      'ENDED': 'bg-secondary',
      'DRAFT': 'bg-light text-dark'
    };
    return `<span class="badge ${map[status] || 'bg-secondary'}">${AdminAPI.escapeHtml(status || 'UNKNOWN')}</span>`;
  }

  async function loadCampaigns() {
    const el = document.getElementById('campaignsTable');
    const res = await AdminAPI.getCampaigns();

    if (!res.success) {
      el.innerHTML = `<div class="alert alert-danger m-3">${AdminAPI.escapeHtml(res.message || 'Error')}</div>`;
      return;
    }

    const list = res.campaigns || [];

    const active = list.filter(c => c.status === 'ACTIVE').length;
    const merchants = new Set(list.map(c => c.merchantName).filter(Boolean)).size;
    const avgComm = list.length
      ? (list.reduce((s, c) => s + (c.baseCommissionRate || 0), 0) / list.length).toFixed(1)
      : 0;

    document.getElementById('statTotal').textContent = AdminAPI.fmtNumber(list.length);
    document.getElementById('statActive').textContent = AdminAPI.fmtNumber(active);
    document.getElementById('statMerchants').textContent = AdminAPI.fmtNumber(merchants);
    document.getElementById('statAvgCommission').textContent = avgComm + '%';

    if (list.length === 0) {
      el.innerHTML = `
        <div class="text-center py-5">
          <i class="bi bi-megaphone text-muted" style="font-size:3rem;"></i>
          <h5 class="mt-3 mb-1">Belum Ada Campaign</h5>
          <p class="text-muted small mb-0">Tambahkan campaign dari Firebase Console</p>
        </div>`;
      return;
    }

    el.innerHTML = `
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead>
            <tr>
              <th>Judul</th>
              <th>Merchant</th>
              <th>Kategori</th>
              <th>Payout</th>
              <th class="text-end">Commission</th>
              <th class="text-center">Status</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(c => `
              <tr>
                <td>
                  <div class="fw-semibold small">${AdminAPI.escapeHtml(c.title || '-')}</div>
                  <code class="text-muted" style="font-size:0.7rem;">${AdminAPI.escapeHtml(c.id || '')}</code>
                </td>
                <td class="small">${AdminAPI.escapeHtml(c.merchantName || '-')}</td>
                <td><span class="badge bg-light text-dark small">${AdminAPI.escapeHtml(c.category || '-')}</span></td>
                <td class="small">
                  <div>${AdminAPI.escapeHtml(c.payoutType || '-')}</div>
                  <div class="text-muted" style="font-size:0.7rem;">${AdminAPI.escapeHtml(c.commissionDisplay || '')}</div>
                </td>
                <td class="text-end fw-semibold text-success">${c.baseCommissionRate ? c.baseCommissionRate + '%' : '-'}</td>
                <td class="text-center">${statusBadge(c.status)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  document.getElementById('refreshBtn').onclick = () => {
    loadCampaigns();
    AdminAPI.toast('Data diperbarui', 'success');
  };

  await loadCampaigns();
})();
</script>
</body>
</html>
