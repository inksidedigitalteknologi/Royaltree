<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Monitor — Royaltree Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
  <script>
    (function() {
      if (!localStorage.getItem('royaltree_admin_token')) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>

  <div class="flex-grow-1" style="min-width:0;">
    <div id="admin-navbar"></div>

    <main class="admin-content">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h4 class="mb-1 fw-bold">Chat Monitor</h4>
          <p class="text-muted mb-0 small">Pantau & moderasi chat global</p>
        </div>
        <div class="d-flex gap-2">
          <input type="text" class="form-control form-control-sm" id="searchInput"
                 placeholder="Cari pesan / user..." style="min-width:240px;">
          <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-primary-subtle text-primary mb-2">
                <i class="bi bi-chat-dots"></i>
              </div>
              <div class="stat-value" id="statTotal">0</div>
              <div class="stat-label">Total Pesan</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-success-subtle text-success mb-2">
                <i class="bi bi-people"></i>
              </div>
              <div class="stat-value" id="statUsers">0</div>
              <div class="stat-label">Pengirim Unik</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-warning-subtle text-warning mb-2">
                <i class="bi bi-clock-history"></i>
              </div>
              <div class="stat-value" id="statToday">0</div>
              <div class="stat-label">Hari Ini</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-danger-subtle text-danger mb-2">
                <i class="bi bi-exclamation-triangle"></i>
              </div>
              <div class="stat-value" id="statFlagged">0</div>
              <div class="stat-label">Kata Kotor</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Chat List -->
      <div class="card stat-card">
        <div class="card-body p-0" id="chatList">
          <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(async function () {
  AdminLayout.init('Chat Monitor');

  let allMessages = [];

  // Kata kotor sederhana untuk deteksi (bisa diperluas)
  const BAD_WORDS = ['kontol', 'memek', 'anjing', 'bangsat', 'bajingan', 'tai', 'pepek', 'pler', 'peler'];

  function hasBadWord(text) {
    if (!text) return false;
    const lower = text.toLowerCase();
    return BAD_WORDS.some(w => lower.includes(w));
  }

  function highlightBadWords(text) {
    let result = AdminAPI.escapeHtml(text);
    BAD_WORDS.forEach(w => {
      const re = new RegExp(w, 'gi');
      result = result.replace(re, `<mark class="bg-danger-subtle">${w}</mark>`);
    });
    return result;
  }

  function renderStats(msgs) {
    const uniqueUsers = new Set(msgs.map(m => m.userId)).size;
    const todayStart = new Date().setHours(0, 0, 0, 0);
    const todayMsgs = msgs.filter(m => (m.timestamp || 0) >= todayStart).length;
    const flaggedMsgs = msgs.filter(m => hasBadWord(m.message)).length;

    document.getElementById('statTotal').textContent = AdminAPI.fmtNumber(msgs.length);
    document.getElementById('statUsers').textContent = AdminAPI.fmtNumber(uniqueUsers);
    document.getElementById('statToday').textContent = AdminAPI.fmtNumber(todayMsgs);
    document.getElementById('statFlagged').textContent = AdminAPI.fmtNumber(flaggedMsgs);
  }

  function renderList(msgs) {
    const el = document.getElementById('chatList');

    if (msgs.length === 0) {
      el.innerHTML = `
        <div class="text-center py-5">
          <i class="bi bi-chat-square-text text-muted" style="font-size:3rem;"></i>
          <h5 class="mt-3 mb-1">Tidak Ada Chat</h5>
          <p class="text-muted small mb-0">Belum ada pesan dari user</p>
        </div>`;
      return;
    }

    el.innerHTML = `
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead>
            <tr>
              <th style="width:60px;">Avatar</th>
              <th>User</th>
              <th>Pesan</th>
              <th style="width:180px;">Waktu</th>
              <th style="width:80px;" class="text-end">Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${msgs.map(m => {
              const bad = hasBadWord(m.message);
              return `
              <tr class="${bad ? 'table-danger' : ''}">
                <td>
                  <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center"
                       style="width:36px;height:36px;font-weight:600;">
                    ${AdminAPI.escapeHtml((m.userName || 'U')[0].toUpperCase())}
                  </div>
                </td>
                <td>
                  <div class="fw-semibold small">${AdminAPI.escapeHtml(m.userName || 'Unknown')}</div>
                  <code class="text-muted" style="font-size:0.7rem;">${AdminAPI.escapeHtml((m.userId || '').slice(0, 14))}...</code>
                </td>
                <td class="small">
                  ${bad ? '<i class="bi bi-exclamation-triangle-fill text-danger me-1"></i>' : ''}
                  ${highlightBadWords(m.message || '')}
                </td>
                <td class="small text-muted">${AdminAPI.fmtDate(m.timestamp || m.createdAt)}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-danger" onclick="deleteMsg('${m.id}')" title="Hapus pesan">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  async function loadMessages() {
    document.getElementById('chatList').innerHTML = `
      <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>`;

    const res = await AdminAPI.getChatMessages();
    if (!res.success) {
      document.getElementById('chatList').innerHTML = `
        <div class="alert alert-danger m-3">${AdminAPI.escapeHtml(res.message || 'Error')}</div>`;
      return;
    }

    allMessages = res.messages || [];
    renderStats(allMessages);
    renderList(allMessages);
  }

  // Search
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) return renderList(allMessages);

    const filtered = allMessages.filter(m =>
      (m.message || '').toLowerCase().includes(q) ||
      (m.userName || '').toLowerCase().includes(q) ||
      (m.userId || '').toLowerCase().includes(q)
    );
    renderList(filtered);
  });

  document.getElementById('refreshBtn').onclick = () => {
    loadMessages();
    AdminAPI.toast('Data diperbarui', 'success');
  };

  // Delete message
  window.deleteMsg = async (id) => {
    if (!confirm('Hapus pesan ini?')) return;
    const res = await AdminAPI.del(`/chat/${id}`);
    if (res.success) {
      AdminAPI.toast('Pesan dihapus', 'success');
      loadMessages();
    } else {
      AdminAPI.toast(res.message || 'Gagal hapus', 'error');
    }
  };

  await loadMessages();

  // Auto-refresh tiap 30 detik — hanya saat tab aktif
  let refreshInterval = null;

  function startAutoRefresh() {
    if (refreshInterval) return;
    refreshInterval = setInterval(loadMessages, 30000);
  }

  function stopAutoRefresh() {
    if (refreshInterval) {
      clearInterval(refreshInterval);
      refreshInterval = null;
    }
  }

  // Handle tab visibility
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopAutoRefresh();
    } else {
      loadMessages();   // refresh sekali saat tab kembali aktif
      startAutoRefresh();
    }
  });

  // Start kalau tab aktif
  if (!document.hidden) {
    startAutoRefresh();
  }
})();
</script>
</body>
</html>
