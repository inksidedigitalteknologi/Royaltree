<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Missions — Royaltree Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
  <script>
    (function() {
      if (!localStorage.getItem('royaltree_admin_token')) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>
  <div class="flex-grow-1" style="min-width:0;">
    <div id="admin-navbar"></div>

    <main class="admin-content">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h4 class="mb-1 fw-bold">Missions</h4>
          <p class="text-muted mb-0 small">Daftar misi & engagement task untuk user</p>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
      </div>

      <!-- Stats -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-primary-subtle text-primary mb-2">
                <i class="bi bi-flag"></i>
              </div>
              <div class="stat-value" id="statTotal">0</div>
              <div class="stat-label">Total Missions</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-success-subtle text-success mb-2">
                <i class="bi bi-coin"></i>
              </div>
              <div class="stat-value" id="statTotalReward">0</div>
              <div class="stat-label">Total RTP Reward</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-warning-subtle text-warning mb-2">
                <i class="bi bi-diagram-3"></i>
              </div>
              <div class="stat-value" id="statCategories">0</div>
              <div class="stat-label">Kategori</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card stat-card">
            <div class="card-body">
              <div class="stat-icon bg-info-subtle text-info mb-2">
                <i class="bi bi-globe"></i>
              </div>
              <div class="stat-value" id="statPlatforms">0</div>
              <div class="stat-label">Platform</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card stat-card">
        <div class="card-body p-0" id="missionsTable">
          <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(async function () {
  AdminLayout.init('Missions');

  function categoryBadge(cat) {
    const colors = {
      'SUBSCRIBE': 'bg-danger',
      'WEB': 'bg-info',
      'SOCIAL': 'bg-primary',
      'VIDEO': 'bg-warning text-dark',
      'SHARE': 'bg-success'
    };
    return `<span class="badge ${colors[cat] || 'bg-secondary'}">${AdminAPI.escapeHtml(cat || 'GENERAL')}</span>`;
  }

  async function loadMissions() {
    const el = document.getElementById('missionsTable');
    const res = await AdminAPI.getMissions();

    if (!res.success) {
      el.innerHTML = `<div class="alert alert-danger m-3">${AdminAPI.escapeHtml(res.message || 'Error')}</div>`;
      return;
    }

    const list = res.missions || [];

    // Stats
    document.getElementById('statTotal').textContent = AdminAPI.fmtNumber(list.length);
    document.getElementById('statTotalReward').textContent =
      AdminAPI.fmtNumber(list.reduce((s, m) => s + (m.rtpReward || 0), 0));
    document.getElementById('statCategories').textContent =
      new Set(list.map(m => m.category).filter(Boolean)).size;
    document.getElementById('statPlatforms').textContent =
      new Set(list.map(m => m.targetPlatform).filter(Boolean)).size;

    if (list.length === 0) {
      el.innerHTML = `
        <div class="text-center py-5">
          <i class="bi bi-flag text-muted" style="font-size:3rem;"></i>
          <h5 class="mt-3 mb-1">Belum Ada Misi</h5>
          <p class="text-muted small mb-0">Tambahkan misi dari Firebase Console</p>
        </div>`;
      return;
    }

    el.innerHTML = `
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead>
            <tr>
              <th>Judul</th>
              <th>Kategori</th>
              <th>Platform</th>
              <th>Type</th>
              <th class="text-end">Reward (RTP)</th>
              <th class="text-center">Durasi</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(m => `
              <tr>
                <td>
                  <div class="fw-semibold small">${AdminAPI.escapeHtml(m.title || '-')}</div>
                  <code class="text-muted" style="font-size:0.7rem;">${AdminAPI.escapeHtml(m.id || '')}</code>
                </td>
                <td>${categoryBadge(m.category)}</td>
                <td class="small">${AdminAPI.escapeHtml(m.targetPlatform || '-')}</td>
                <td><span class="badge bg-light text-dark small">${AdminAPI.escapeHtml(m.type || '-')}</span></td>
                <td class="text-end fw-semibold text-success">+${AdminAPI.fmtNumber(m.rtpReward || 0)}</td>
                <td class="text-center small">${m.durationSeconds ? m.durationSeconds + 's' : '-'}</td>
                <td class="text-end">
                  ${m.actionUrl
                    ? `<a href="${AdminAPI.escapeHtml(m.actionUrl)}" target="_blank" class="btn btn-sm btn-outline-primary">
                         <i class="bi bi-box-arrow-up-right"></i>
                       </a>`
                    : '-'}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  document.getElementById('refreshBtn').onclick = () => {
    loadMissions();
    AdminAPI.toast('Data diperbarui', 'success');
  };

  await loadMissions();
})();
</script>
</body>
</html>
