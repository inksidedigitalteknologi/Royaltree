<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Detail — Royaltree Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
  <script>
    (function() {
      if (!localStorage.getItem('royaltree_admin_token')) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>
  <div class="flex-grow-1" style="min-width:0;">
    <div id="admin-navbar"></div>

    <main class="admin-content">
      <div class="mb-4">
        <h4 class="mb-1 fw-bold">User Detail & Anomaly</h4>
        <p class="text-muted mb-0 small">Lihat detail user + anomaly score + history</p>
      </div>

      <!-- Search Form -->
      <div class="card stat-card mb-4">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-9">
              <label class="form-label small fw-semibold mb-1">User UID</label>
              <input type="text" class="form-control" id="searchUid" placeholder="Masukkan UID user...">
              <div class="form-text small">Contoh: VTmp1Za0Awc8juAgLa2g3rJ3tS82</div>
            </div>
            <div class="col-md-3">
              <button class="btn btn-primary w-100" id="searchBtn">
                <i class="bi bi-search me-1"></i>Search
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="resultBox"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(function () {
  AdminLayout.init('User Detail');

  const searchInput = document.getElementById('searchUid');
  const searchBtn = document.getElementById('searchBtn');
  const resultBox = document.getElementById('resultBox');

  const urlParams = new URLSearchParams(window.location.search);
  const urlUid = urlParams.get('uid');
  if (urlUid) {
    searchInput.value = urlUid;
    loadUser(urlUid);
  }

  function severityBadge(s) {
    const map = { 'LOW': 'bg-info', 'MEDIUM': 'bg-warning text-dark', 'HIGH': 'bg-danger', 'CRITICAL': 'bg-dark' };
    return `<span class="badge ${map[s] || 'bg-secondary'}">${s || 'LOW'}</span>`;
  }

  function statusBadge(s) {
    const map = { 'OPEN': 'bg-danger', 'REVIEWED': 'bg-warning text-dark', 'BANNED': 'bg-dark', 'DISMISSED': 'bg-secondary' };
    return `<span class="badge ${map[s] || 'bg-secondary'}">${s || 'OPEN'}</span>`;
  }

  function scoreColor(score, flagT, banT) {
    if (score >= banT) return 'danger';
    if (score >= flagT) return 'warning';
    if (score > 0) return 'info';
    return 'success';
  }

  async function loadUser(uid) {
    resultBox.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

    const res = await AdminAPI.getUserDetail(uid);
    if (!res.success) {
      resultBox.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>${AdminAPI.escapeHtml(res.message || 'Gagal')}</div>`;
      return;
    }

    const d = res.data || {};
    const user = d.user || {};
    const config = d.config || { flagThreshold: 50, banThreshold: 100 };
    const scoreClr = scoreColor(d.score, config.flagThreshold, config.banThreshold);

    resultBox.innerHTML = `
      <div class="card stat-card mb-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h6 class="fw-bold mb-0"><i class="bi bi-person-circle me-2"></i>User Information</h6>
            ${user.banned ? '<span class="badge bg-danger">BANNED</span>' : '<span class="badge bg-success">ACTIVE</span>'}
          </div>
          <div class="row g-3">
            <div class="col-md-6"><strong>UID:</strong> <code class="small">${AdminAPI.escapeHtml(d.uid)}</code></div>
            <div class="col-md-6"><strong>Name:</strong> ${AdminAPI.escapeHtml(user.name || '-')}</div>
            <div class="col-md-6"><strong>Email:</strong> ${AdminAPI.escapeHtml(user.email || '-')}</div>
            <div class="col-md-6"><strong>Phone:</strong> ${AdminAPI.escapeHtml(user.phone || '-')}</div>
            <div class="col-md-6"><strong>Tier:</strong> <span class="badge bg-warning text-dark">${AdminAPI.escapeHtml(user.tier || 'FREE')}</span></div>
            <div class="col-md-6"><strong>Referral Code:</strong> <code>${AdminAPI.escapeHtml(user.referralCode || '-')}</code></div>
            <div class="col-md-6"><strong>City/Region:</strong> ${AdminAPI.escapeHtml(user.city || user.region || '-')}</div>
            <div class="col-md-6"><strong>Language:</strong> ${AdminAPI.escapeHtml(user.language || 'id')}</div>

            <div class="col-12"><hr class="my-1"></div>

            <div class="col-md-6"><strong>Balance:</strong> ${AdminAPI.fmtNumber(user.balance || 0)}</div>
            <div class="col-md-6"><strong>Points:</strong> ${AdminAPI.fmtNumber((user.points || 0).toFixed(2))}</div>
            <div class="col-md-6"><strong>Miner Tokens:</strong> ${AdminAPI.fmtNumber(user.minerTokens || 0)}</div>
            <div class="col-md-6"><strong>Total Miners Owned:</strong> ${AdminAPI.fmtNumber(d.totalMiners || 0)}</div>
            <div class="col-md-6"><strong>Referral Count:</strong> ${AdminAPI.fmtNumber(d.referralCount || 0)}</div>
            <div class="col-md-6"><strong>Mining Logs:</strong> ${AdminAPI.fmtNumber(d.totalMiningLogs || 0)}</div>

            <div class="col-12"><hr class="my-1"></div>

            <div class="col-md-6"><strong>Today Steps:</strong> ${AdminAPI.fmtNumber(user.todaySteps || 0)}</div>
            <div class="col-md-6"><strong>Today Ads:</strong> ${user.todayAdsWatched || 0}</div>
            <div class="col-md-6"><strong>Check-in Streak:</strong> ${user.checkInStreak || 0} hari</div>
            <div class="col-md-6"><strong>Month Check-ins:</strong> ${user.monthCheckInCount || 0}</div>

            <div class="col-12"><hr class="my-1"></div>

            <div class="col-md-6"><strong>Last Login:</strong> ${AdminAPI.fmtDate(user.lastLoginAt)}</div>
            <div class="col-md-6"><strong>Last Login IP:</strong> <code class="small">${AdminAPI.escapeHtml(user.lastLoginIp || '-')}</code></div>
            <div class="col-md-6"><strong>Created:</strong> ${AdminAPI.fmtDate(user.createdAt)}</div>
            <div class="col-md-6"><strong>Updated:</strong> ${AdminAPI.fmtDate(user.updatedAt)}</div>

            <div class="col-md-6"><strong>FCM Token:</strong> ${d.hasFcmToken ? '<span class="badge bg-success">✅ Active</span>' : '<span class="badge bg-secondary">❌ None</span>'}</div>
            <div class="col-md-6"><strong>Mining:</strong> ${d.miningPaused ? '<span class="badge bg-warning text-dark">⏸ Paused</span>' : '<span class="badge bg-success">▶ Active</span>'}</div>

            ${user.banned ? `
              <div class="col-12">
                <div class="alert alert-danger mb-0">
                  <strong>Ban Reason:</strong> ${AdminAPI.escapeHtml(user.bannedReason || '-')}<br>
                  <strong>Banned At:</strong> ${AdminAPI.fmtDate(user.bannedAt)}<br>
                  <strong>Banned By:</strong> ${AdminAPI.escapeHtml(user.bannedBy || '-')}
                </div>
              </div>
            ` : ''}

            ${user.unbannedAt ? `
              <div class="col-12">
                <div class="alert alert-success mb-0">
                  <strong>Unbanned At:</strong> ${AdminAPI.fmtDate(user.unbannedAt)}<br>
                  <strong>Unbanned By:</strong> ${AdminAPI.escapeHtml(user.unbannedBy || '-')}
                </div>
              </div>
            ` : ''}
          </div>
          <hr>
          <div class="d-flex gap-2">
            ${user.banned
              ? `<button class="btn btn-success" onclick="unbanUser('${d.uid}')"><i class="bi bi-check-circle me-1"></i>Unban</button>`
              : `<button class="btn btn-danger" onclick="banUser('${d.uid}')"><i class="bi bi-hammer me-1"></i>Ban</button>`}
            <a href="users.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
          </div>
        </div>
      </div>

      <div class="card stat-card mb-4">
        <div class="card-body">
          <h6 class="fw-bold mb-3"><i class="bi bi-shield-exclamation me-2"></i>Anomaly Score</h6>
          <div class="row g-3 align-items-center">
            <div class="col-md-3 text-center">
              <div class="display-4 fw-bold text-${scoreClr}">${d.score || 0}</div>
              <div class="small text-muted">Score</div>
            </div>
            <div class="col-md-9">
              <div class="mb-2">
                <span class="badge ${d.flagged ? 'bg-warning text-dark' : 'bg-success'} me-2">${d.flagged ? 'FLAGGED' : 'NORMAL'}</span>
                ${d.autoBanCandidate ? '<span class="badge bg-danger">AUTO-BAN CANDIDATE</span>' : ''}
              </div>
              <div class="small text-muted mb-2">Flag: <strong>${config.flagThreshold}</strong> · Ban: <strong>${config.banThreshold}</strong></div>
              <div class="progress" style="height:8px;">
                <div class="progress-bar bg-${scoreClr}" style="width:${Math.min(100, (d.score / config.banThreshold) * 100)}%"></div>
              </div>
              <div class="small text-muted mt-1">Flags: <strong>${(d.flags || []).join(', ') || 'none'}</strong></div>
            </div>
          </div>
          ${d.score > 0 ? `
            <hr>
            <button class="btn btn-outline-secondary btn-sm" onclick="clearFlag('${d.uid}')">
              <i class="bi bi-eraser me-1"></i>Clear Flag
            </button>` : ''}
        </div>
      </div>

      ${d.thermal ? `
        <div class="card stat-card mb-4">
          <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-thermometer-half me-2 text-danger"></i>Thermal Status (Last Report)</h6>
            <div class="row g-3">
              <div class="col-md-4">
                <div class="text-center">
                  <div class="display-6 fw-bold text-${d.thermal.phone_temp >= 45 ? 'danger' : (d.thermal.phone_temp >= 35 ? 'warning' : 'success')}">
                    ${(d.thermal.phone_temp || 0).toFixed(1)}°C
                  </div>
                  <div class="small text-muted">Temperature</div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="text-center">
                  <div class="display-6 fw-bold text-${(d.thermal.battery_level || 0) < 15 ? 'danger' : ((d.thermal.battery_level || 0) < 30 ? 'warning' : 'success')}">
                    ${d.thermal.battery_level || 0}%
                  </div>
                  <div class="small text-muted">Battery Level</div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="text-center">
                  <div class="display-6 fw-bold">
                    ${d.thermal.is_charging ? '⚡' : '🔋'}
                  </div>
                  <div class="small text-muted">${d.thermal.is_charging ? 'Charging' : 'Not Charging'}</div>
                </div>
              </div>
              ${d.thermal.updatedAt ? `
                <div class="col-12">
                  <div class="small text-muted text-center">
                    <i class="bi bi-clock me-1"></i>Last update: ${AdminAPI.fmtDate(d.thermal.updatedAt)}
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      ` : ''}

      ${d.location ? `
        <div class="card stat-card mb-4">
          <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-geo-alt me-2 text-info"></i>Location (Last Report)</h6>
            <div class="row g-3">
              <div class="col-md-4"><strong>Region:</strong> ${AdminAPI.escapeHtml(d.location.region || 'Unknown')}</div>
              <div class="col-md-4"><strong>Latitude:</strong> <code class="small">${d.location.latitude || 0}</code></div>
              <div class="col-md-4"><strong>Longitude:</strong> <code class="small">${d.location.longitude || 0}</code></div>
              ${d.location.updatedAt ? `
                <div class="col-12">
                  <div class="small text-muted">
                    <i class="bi bi-clock me-1"></i>Last update: ${AdminAPI.fmtDate(d.location.updatedAt)}
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      ` : ''}

        ${d.gameRoom ? `
          <div class="card stat-card mb-4">
            <div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-hdd-stack me-2 text-warning"></i>Mining Detail</h6>
              <div class="row g-3">
                <div class="col-md-3">
                  <div class="text-center">
                    <div class="display-6 fw-bold text-warning">${(d.gameRoom.ratePerMin || 0).toFixed(4)}</div>
                    <div class="small text-muted">RTP / menit</div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="text-center">
                    <div class="display-6 fw-bold text-success">${(d.gameRoom.unclaimedMiningPoints || 0).toFixed(2)}</div>
                    <div class="small text-muted">Unclaimed</div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="text-center">
                    <div class="display-6 fw-bold">${d.gameRoom.placedMinersCount || 0}</div>
                    <div class="small text-muted">Active Miners</div>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="text-center">
                    <div class="display-6 fw-bold">${d.gameRoom.isMinerActive ? '▶' : '⏸'}</div>
                    <div class="small text-muted">${d.gameRoom.isMinerActive ? 'Active' : 'Inactive'}</div>
                  </div>
                </div>
                <div class="col-md-6"><strong>Last Claim:</strong> ${AdminAPI.fmtDate(d.gameRoom.lastClaimTimestamp)}</div>
                <div class="col-md-6"><strong>Miner Active Until:</strong> ${d.gameRoom.minerActiveUntil ? AdminAPI.fmtDate(d.gameRoom.minerActiveUntil) : '-'}</div>
              </div>
            </div>
          </div>
        ` : ''}

        ${(d.referredByUser || d.referralUrl) ? `
          <div class="card stat-card mb-4">
            <div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-people me-2 text-primary"></i>Referral Info</h6>
              <div class="row g-3">
                ${d.referredByUser ? `
                  <div class="col-md-6"><strong>Referred By:</strong> ${AdminAPI.escapeHtml(d.referredByUser.name)} <code class="small">(${AdminAPI.escapeHtml(d.referredByUser.uid.slice(0, 12))}...)</code></div>
                  <div class="col-md-6"><strong>Referrer Email:</strong> ${AdminAPI.escapeHtml(d.referredByUser.email)}</div>
                ` : '<div class="col-md-6"><strong>Referred By:</strong> - (user join organik)</div>'}
                <div class="col-md-6"><strong>Referral Count:</strong> ${AdminAPI.fmtNumber(d.referralCount || 0)}</div>
                <div class="col-md-6"><strong>Referral Earnings:</strong> ${AdminAPI.fmtNumber(d.referralEarnings || 0)} RTP</div>
                ${d.referralUrl ? `<div class="col-12"><strong>Referral URL:</strong> <a href="${d.referralUrl}" target="_blank">${d.referralUrl}</a></div>` : ''}
              </div>
            </div>
          </div>
        ` : ''}

        <div class="card stat-card mb-4">
          <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-shield-lock me-2 text-success"></i>Security & Account Age</h6>
            <div class="row g-3">
              <div class="col-md-3"><strong>2FA:</strong> ${d.is2FAEnabled ? '<span class="badge bg-success">Enabled</span>' : '<span class="badge bg-secondary">Disabled</span>'}</div>
              <div class="col-md-3"><strong>Email Verified:</strong> ${d.emailVerified ? '<span class="badge bg-success">✅</span>' : '<span class="badge bg-warning text-dark">❌</span>'}</div>
              <div class="col-md-3"><strong>Last Login IP:</strong> <code class="small">${AdminAPI.escapeHtml(user.lastLoginIp || '-')}</code></div>
              <div class="col-md-3"><strong>Days Since Register:</strong> ${d.daysSinceRegister ?? '-'} hari</div>
              <div class="col-md-3"><strong>Days Since Last Login:</strong> ${d.daysSinceLastLogin ?? '-'} hari</div>
            </div>
          </div>
        </div>

        <div class="card stat-card mb-4">
          <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-graph-up me-2 text-info"></i>Analytics & Activity</h6>
            <div class="row g-3">
              <div class="col-md-3"><strong>Total RTP Earned:</strong> ${AdminAPI.fmtNumber(d.totalRTPEarned || 0)}</div>
              <div class="col-md-3"><strong>Total Ads Watched:</strong> ${AdminAPI.fmtNumber(d.totalAdsWatched || 0)}</div>
              <div class="col-md-3"><strong>Transactions:</strong> ${AdminAPI.fmtNumber(d.transactionCount || 0)}</div>
              <div class="col-md-3"><strong>Withdrawals:</strong> ${AdminAPI.fmtNumber(d.withdrawCount || 0)}</div>
              <div class="col-md-3"><strong>Chat Messages:</strong> ${AdminAPI.fmtNumber(d.chatCount || 0)}</div>
              <div class="col-md-3"><strong>Missions Completed:</strong> ${AdminAPI.fmtNumber(d.missionsCompleted || 0)}</div>
              <div class="col-md-3"><strong>Ban History:</strong> ${AdminAPI.fmtNumber(d.banHistoryCount || 0)}x</div>
            </div>
          </div>
        </div>

        ${(d.deviceModel || d.androidVersion || d.appVersion) ? `
          <div class="card stat-card mb-4">
            <div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-phone me-2"></i>Device Info</h6>
              <div class="row g-3">
                <div class="col-md-3"><strong>Device:</strong> ${AdminAPI.escapeHtml(d.deviceModel || '-')}</div>
                <div class="col-md-3"><strong>Android:</strong> ${AdminAPI.escapeHtml(d.androidVersion || '-')}</div>
                <div class="col-md-3"><strong>App Version:</strong> ${AdminAPI.escapeHtml(d.appVersion || '-')}</div>
                <div class="col-md-3"><strong>First Install:</strong> ${AdminAPI.fmtDate(d.firstInstall)}</div>
              </div>
            </div>
          </div>
        ` : ''}

        ${(d.auditTrail || []).length > 0 ? `
          <div class="card stat-card mb-4">
            <div class="card-header bg-white">
              <h6 class="fw-bold mb-0"><i class="bi bi-journal-text me-2"></i>Audit Trail <span class="badge bg-secondary ms-2">${(d.auditTrail || []).length}</span></h6>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-sm table-hover mb-0 align-middle">
                  <thead><tr><th>Action</th><th>Detail</th><th>Waktu</th></tr></thead>
                  <tbody>
                    ${(d.auditTrail || []).slice(0, 10).map(a => `
                      <tr>
                        <td><strong class="small">${AdminAPI.escapeHtml(a.action || '-')}</strong></td>
                        <td class="small text-muted">${AdminAPI.escapeHtml(a.message || a.detail || '-')}</td>
                        <td class="small text-muted">${AdminAPI.fmtDate(a.timestamp)}</td>
                      </tr>`).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        ` : ''}

      <div class="card stat-card">
        <div class="card-header bg-white">
          <h6 class="fw-bold mb-0"><i class="bi bi-clock-history me-2"></i>Anomaly History <span class="badge bg-secondary ms-2">${(d.history || []).length}</span></h6>
        </div>
        <div class="card-body p-0">
          ${(d.history || []).length === 0 ? `
            <div class="text-center py-5">
              <i class="bi bi-check-circle text-success" style="font-size:3rem;"></i>
              <h5 class="mt-3 mb-1">Tidak Ada Anomali</h5>
              <p class="text-muted small mb-0">User ini bersih ✅</p>
            </div>` : `
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead><tr><th>Type</th><th>Severity</th><th>Message</th><th>Waktu</th><th>Status</th></tr></thead>
                <tbody>
                  ${(d.history || []).map(a => `
                    <tr>
                      <td><strong class="small">${AdminAPI.escapeHtml(a.type || '-')}</strong></td>
                      <td>${severityBadge(a.severity)}</td>
                      <td class="small text-muted">${AdminAPI.escapeHtml(a.message || '-')}</td>
                      <td class="small text-muted">${AdminAPI.fmtDate(a.timestamp)}</td>
                      <td>${statusBadge(a.status)}</td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>`}
        </div>
      </div>`;
  }

  window.banUser = async (uid) => {
    const reason = prompt('Alasan ban:', 'Fraud detected');
    if (reason === null) return;
    const res = await AdminAPI.banUser(uid, reason);
    if (res.success) { AdminAPI.toast('User dibanned', 'success'); loadUser(uid); }
    else AdminAPI.toast(res.message || 'Gagal', 'error');
  };

  window.unbanUser = async (uid) => {
    if (!confirm('Unban user ini?')) return;
    const res = await AdminAPI.unbanUser(uid);
    if (res.success) { AdminAPI.toast('User di-unban', 'success'); loadUser(uid); }
    else AdminAPI.toast(res.message || 'Gagal', 'error');
  };

  window.clearFlag = async (uid) => {
    if (!confirm('Reset anomaly score?')) return;
    const res = await AdminAPI.clearFlag(uid);
    if (res.success) { AdminAPI.toast('Flag dibersihkan', 'success'); loadUser(uid); }
    else AdminAPI.toast(res.message || 'Gagal', 'error');
  };

  searchBtn.onclick = () => {
    const uid = searchInput.value.trim();
    if (uid) loadUser(uid);
  };

  searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchBtn.click(); });
})();
</script>
</body>
</html>
