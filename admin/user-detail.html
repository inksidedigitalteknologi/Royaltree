<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Detail — Royaltree Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
  <script>
    (function() {
      if (!localStorage.getItem('royaltree_admin_token')) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>
  <div class="flex-grow-1" style="min-width:0;">
    <div id="admin-navbar"></div>

    <main class="admin-content">
      <div class="mb-4">
        <h4 class="mb-1 fw-bold">User Detail & Anomaly</h4>
        <p class="text-muted mb-0 small">Lihat detail user + anomaly score + history</p>
      </div>

      <!-- Search Form -->
      <div class="card stat-card mb-4">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-9">
              <label class="form-label small fw-semibold mb-1">User UID</label>
              <input type="text" class="form-control" id="searchUid" placeholder="Masukkan UID user...">
              <div class="form-text small">Contoh: VTmp1Za0Awc8juAgLa2g3rJ3tS82</div>
            </div>
            <div class="col-md-3">
              <button class="btn btn-primary w-100" id="searchBtn">
                <i class="bi bi-search me-1"></i>Search
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="resultBox"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(function () {
  AdminLayout.init('User Detail');

  const searchInput = document.getElementById('searchUid');
  const searchBtn = document.getElementById('searchBtn');
  const resultBox = document.getElementById('resultBox');

  const urlParams = new URLSearchParams(window.location.search);
  const urlUid = urlParams.get('uid');
  if (urlUid) {
    searchInput.value = urlUid;
    loadUser(urlUid);
  }

  function severityBadge(s) {
    const map = { 'LOW': 'bg-info', 'MEDIUM': 'bg-warning text-dark', 'HIGH': 'bg-danger', 'CRITICAL': 'bg-dark' };
    return `<span class="badge ${map[s] || 'bg-secondary'}">${s || 'LOW'}</span>`;
  }

  function statusBadge(s) {
    const map = { 'OPEN': 'bg-danger', 'REVIEWED': 'bg-warning text-dark', 'BANNED': 'bg-dark', 'DISMISSED': 'bg-secondary' };
    return `<span class="badge ${map[s] || 'bg-secondary'}">${s || 'OPEN'}</span>`;
  }

  function scoreColor(score, flagT, banT) {
    if (score >= banT) return 'danger';
    if (score >= flagT) return 'warning';
    if (score > 0) return 'info';
    return 'success';
  }

  async function loadUser(uid) {
    resultBox.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

    const res = await AdminAPI.getUserDetail(uid);
    if (!res.success) {
      resultBox.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>${AdminAPI.escapeHtml(res.message || 'Gagal')}</div>`;
      return;
    }

    const d = res.data || {};
    const user = d.user || {};
    const config = d.config || { flagThreshold: 50, banThreshold: 100 };
    const scoreClr = scoreColor(d.score, config.flagThreshold, config.banThreshold);

    resultBox.innerHTML = `
      <div class="card stat-card mb-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h6 class="fw-bold mb-0"><i class="bi bi-person-circle me-2"></i>User Information</h6>
            ${user.banned ? '<span class="badge bg-danger">BANNED</span>' : '<span class="badge bg-success">ACTIVE</span>'}
          </div>
          <div class="row g-3">
            <div class="col-md-6"><strong>UID:</strong> <code class="small">${AdminAPI.escapeHtml(d.uid)}</code></div>
            <div class="col-md-6"><strong>Name:</strong> ${AdminAPI.escapeHtml(user.name || '-')}</div>
            <div class="col-md-6"><strong>Email:</strong> ${AdminAPI.escapeHtml(user.email || '-')}</div>
            <div class="col-md-6"><strong>Tier:</strong> <span class="badge bg-warning text-dark">${AdminAPI.escapeHtml(user.tier || 'FREE')}</span></div>
            <div class="col-md-6"><strong>Balance:</strong> ${AdminAPI.fmtNumber(user.balance || 0)}</div>
            <div class="col-md-6"><strong>Points:</strong> ${AdminAPI.fmtNumber((user.points || 0).toFixed(2))}</div>
            ${user.banned ? `
              <div class="col-12">
                <div class="alert alert-danger mb-0">
                  <strong>Ban Reason:</strong> ${AdminAPI.escapeHtml(user.bannedReason || '-')}<br>
                  <strong>Banned At:</strong> ${AdminAPI.fmtDate(user.bannedAt)}
                </div>
              </div>
            ` : ''}
          </div>
          <hr>
          <div class="d-flex gap-2">
            ${user.banned
              ? `<button class="btn btn-success" onclick="unbanUser('${d.uid}')"><i class="bi bi-check-circle me-1"></i>Unban</button>`
              : `<button class="btn btn-danger" onclick="banUser('${d.uid}')"><i class="bi bi-hammer me-1"></i>Ban</button>`}
            <a href="users.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
          </div>
        </div>
      </div>

      <div class="card stat-card mb-4">
        <div class="card-body">
          <h6 class="fw-bold mb-3"><i class="bi bi-shield-exclamation me-2"></i>Anomaly Score</h6>
          <div class="row g-3 align-items-center">
            <div class="col-md-3 text-center">
              <div class="display-4 fw-bold text-${scoreClr}">${d.score || 0}</div>
              <div class="small text-muted">Score</div>
            </div>
            <div class="col-md-9">
              <div class="mb-2">
                <span class="badge ${d.flagged ? 'bg-warning text-dark' : 'bg-success'} me-2">${d.flagged ? 'FLAGGED' : 'NORMAL'}</span>
                ${d.autoBanCandidate ? '<span class="badge bg-danger">AUTO-BAN CANDIDATE</span>' : ''}
              </div>
              <div class="small text-muted mb-2">Flag: <strong>${config.flagThreshold}</strong> · Ban: <strong>${config.banThreshold}</strong></div>
              <div class="progress" style="height:8px;">
                <div class="progress-bar bg-${scoreClr}" style="width:${Math.min(100, (d.score / config.banThreshold) * 100)}%"></div>
              </div>
              <div class="small text-muted mt-1">Flags: <strong>${(d.flags || []).join(', ') || 'none'}</strong></div>
            </div>
          </div>
          ${d.score > 0 ? `
            <hr>
            <button class="btn btn-outline-secondary btn-sm" onclick="clearFlag('${d.uid}')">
              <i class="bi bi-eraser me-1"></i>Clear Flag
            </button>` : ''}
        </div>
      </div>

      <div class="card stat-card">
        <div class="card-header bg-white">
          <h6 class="fw-bold mb-0"><i class="bi bi-clock-history me-2"></i>Anomaly History <span class="badge bg-secondary ms-2">${(d.history || []).length}</span></h6>
        </div>
        <div class="card-body p-0">
          ${(d.history || []).length === 0 ? `
            <div class="text-center py-5">
              <i class="bi bi-check-circle text-success" style="font-size:3rem;"></i>
              <h5 class="mt-3 mb-1">Tidak Ada Anomali</h5>
              <p class="text-muted small mb-0">User ini bersih ✅</p>
            </div>` : `
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead><tr><th>Type</th><th>Severity</th><th>Message</th><th>Waktu</th><th>Status</th></tr></thead>
                <tbody>
                  ${(d.history || []).map(a => `
                    <tr>
                      <td><strong class="small">${AdminAPI.escapeHtml(a.type || '-')}</strong></td>
                      <td>${severityBadge(a.severity)}</td>
                      <td class="small text-muted">${AdminAPI.escapeHtml(a.message || '-')}</td>
                      <td class="small text-muted">${AdminAPI.fmtDate(a.timestamp)}</td>
                      <td>${statusBadge(a.status)}</td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>`}
        </div>
      </div>`;
  }

  window.banUser = async (uid) => {
    const reason = prompt('Alasan ban:', 'Fraud detected');
    if (reason === null) return;
    const res = await AdminAPI.banUser(uid, reason);
    if (res.success) { AdminAPI.toast('User dibanned', 'success'); loadUser(uid); }
    else AdminAPI.toast(res.message || 'Gagal', 'error');
  };

  window.unbanUser = async (uid) => {
    if (!confirm('Unban user ini?')) return;
    const res = await AdminAPI.unbanUser(uid);
    if (res.success) { AdminAPI.toast('User di-unban', 'success'); loadUser(uid); }
    else AdminAPI.toast(res.message || 'Gagal', 'error');
  };

  window.clearFlag = async (uid) => {
    if (!confirm('Reset anomaly score?')) return;
    const res = await AdminAPI.clearFlag(uid);
    if (res.success) { AdminAPI.toast('Flag dibersihkan', 'success'); loadUser(uid); }
    else AdminAPI.toast(res.message || 'Gagal', 'error');
  };

  searchBtn.onclick = () => {
    const uid = searchInput.value.trim();
    if (uid) loadUser(uid);
  };

  searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchBtn.click(); });
})();
</script>
</body>
</html>
