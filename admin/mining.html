<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mining — Royaltree Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">
  <script>
    (function() {
      if (!localStorage.getItem('royaltree_admin_token')) {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body>

<div class="d-flex">
  <div id="admin-sidebar"></div>

  <div class="flex-grow-1" style="min-width:0;">
    <div id="admin-navbar"></div>

    <main class="admin-content">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h4 class="mb-1 fw-bold">Mining</h4>
          <p class="text-muted mb-0 small">Pool fund health & blok history</p>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh
        </button>
      </div>

      <!-- Pool Fund Health -->
      <div class="row g-3 mb-4" id="poolStats">
        <div class="col-12 text-center py-4">
          <div class="spinner-border text-primary"></div>
        </div>
      </div>

      <!-- Pool Fund Alert -->
      <div id="poolAlert"></div>

      <!-- Blocks History -->
      <div class="card stat-card">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <h6 class="mb-0 fw-bold">
            <i class="bi bi-box-seam me-2 text-primary"></i>Block History
          </h6>
          <span class="badge bg-secondary" id="blocksCount">0</span>
        </div>
        <div class="card-body p-0" id="blocksTable">
          <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(async function () {
  AdminLayout.init('Mining');

  function healthBadge(health) {
    const map = {
      'HEALTHY':  { class: 'bg-success', icon: 'check-circle-fill', text: 'Healthy' },
      'LOW':      { class: 'bg-warning text-dark', icon: 'exclamation-triangle-fill', text: 'Low' },
      'CRITICAL': { class: 'bg-danger', icon: 'x-octagon-fill', text: 'Critical' }
    };
    const m = map[health] || map['CRITICAL'];
    return `<span class="badge ${m.class}"><i class="bi bi-${m.icon} me-1"></i>${m.text}</span>`;
  }

  async function loadPool() {
    const el = document.getElementById('poolStats');
    const alertEl = document.getElementById('poolAlert');

    const res = await AdminAPI.getPoolFund();
    if (!res.success) {
      el.innerHTML = `<div class="col-12"><div class="alert alert-danger">${AdminAPI.escapeHtml(res.message || 'Error')}</div></div>`;
      return;
    }

    const d = res.data || {};

    // 4 Cards
    const cards = [
      { label: 'Pool Balance',    value: d.balance || 0,         icon: 'piggy-bank',   color: 'primary', isCurrency: true },
      { label: 'Total Collected', value: d.totalCollected || 0,  icon: 'arrow-down-circle', color: 'success', isCurrency: true },
      { label: 'Total Paid Out',  value: d.totalPaidOut || 0,    icon: 'arrow-up-circle', color: 'warning', isCurrency: true },
      { label: 'Dev Profit',      value: d.devProfit || 0,       icon: 'cash-coin',    color: 'info', isCurrency: true }
    ];

    el.innerHTML = cards.map(c => `
      <div class="col-6 col-md-3">
        <div class="card stat-card">
          <div class="card-body">
            <div class="stat-icon bg-${c.color}-subtle text-${c.color} mb-2">
              <i class="bi bi-${c.icon}"></i>
            </div>
            <div class="stat-value">${AdminAPI.fmtNumber(c.value)}</div>
            <div class="stat-label">${c.label}</div>
          </div>
        </div>
      </div>`).join('') + `
      <div class="col-12">
        <div class="card stat-card">
          <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
              <div class="text-muted small mb-1">Pool Health Status</div>
              <div class="fs-4">${healthBadge(d.health)}</div>
            </div>
            <div class="text-muted small">
              <i class="bi bi-info-circle me-1"></i>
              Threshold: <strong>HEALTHY</strong> &gt; 1000 · <strong>LOW</strong> &gt; 200 · else <strong>CRITICAL</strong>
            </div>
          </div>
        </div>
      </div>`;

    // Alert kalau CRITICAL/LOW
    if (d.health === 'CRITICAL') {
      alertEl.innerHTML = `
        <div class="alert alert-danger d-flex align-items-center">
          <i class="bi bi-exclamation-octagon-fill fs-3 me-3"></i>
          <div>
            <strong>Pool Fund CRITICAL!</strong><br>
            <span class="small">Saldo pool sangat rendah (${AdminAPI.fmtNumber(d.balance)}). Perlu top-up segera agar block mining tetap bisa dibayar.</span>
          </div>
        </div>`;
    } else if (d.health === 'LOW') {
      alertEl.innerHTML = `
        <div class="alert alert-warning d-flex align-items-center">
          <i class="bi bi-exclamation-triangle-fill fs-3 me-3"></i>
          <div>
            <strong>Pool Fund LOW</strong><br>
            <span class="small">Saldo pool menipis (${AdminAPI.fmtNumber(d.balance)}). Pertimbangkan top-up.</span>
          </div>
        </div>`;
    } else {
      alertEl.innerHTML = '';
    }
  }

  async function loadBlocks() {
    const el = document.getElementById('blocksTable');

    const res = await AdminAPI.getBlocks();
    document.getElementById('blocksCount').textContent = res.count || 0;

    if (!res.success) {
      el.innerHTML = `<div class="alert alert-danger m-3">${AdminAPI.escapeHtml(res.message || 'Error')}</div>`;
      return;
    }

    const list = res.blocks || [];
    if (list.length === 0) {
      el.innerHTML = `
        <div class="text-center py-5">
          <i class="bi bi-box text-muted" style="font-size:3rem;"></i>
          <h5 class="mt-3 mb-1">Belum Ada Block</h5>
          <p class="text-muted small mb-0">Belum ada block yang ditambang</p>
        </div>`;
      return;
    }

    el.innerHTML = `
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead>
            <tr>
              <th>Height</th>
              <th>Miner</th>
              <th class="text-end">Reward</th>
              <th>Hash</th>
              <th>Waktu</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(b => `
              <tr>
                <td><strong>#${AdminAPI.fmtNumber(b.height || 0)}</strong></td>
                <td><code class="small">${AdminAPI.escapeHtml((b.minerUid || b.miner || b.userId || '-').slice(0, 14))}</code></td>
                <td class="text-end fw-semibold">${AdminAPI.fmtNumber(b.reward || 0)}</td>
                <td><code class="small text-muted">${AdminAPI.escapeHtml((b.hash || '-').slice(0, 16))}...</code></td>
                <td class="small text-muted">${AdminAPI.fmtDate(b.timestamp || b.createdAt)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  document.getElementById('refreshBtn').onclick = () => {
    loadPool();
    loadBlocks();
    AdminAPI.toast('Data diperbarui', 'success');
  };

  await Promise.all([loadPool(), loadBlocks()]);
})();
</script>
</body>
</html>
